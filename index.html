<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0096C7">
  <title>CoolNavi - 近くの涼み場所へ、今休もう</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-root">

    <!-- アプリ共通ヘッダー -->
    <header class="app-header">
      <div class="header-left">
        <div class="app-logo">
          <span class="logo-icon">❄️</span>
          <span class="logo-text">CoolNavi</span>
        </div>
        <span class="tagline">今、休もう</span>
      </div>
      <div class="header-right">
        <!-- PCテスト・GPSオフ時用のデモモードスイッチ -->
        <label class="demo-switch" title="東京駅周辺のテスト位置でシミュレーションします">
          <input type="checkbox" id="demo-location-toggle">
          <span class="slider"></span>
          <span class="switch-label">デモ位置</span>
        </label>
      </div>
    </header>

    <!-- メインコンテンツエリア -->
    <main class="app-main">

      <!-- ================= 1. ホーム画面 ================= -->
      <section id="tab-view-home" class="tab-view active">
        <!-- 気象情報カード -->
        <div class="weather-widget">
          <div class="weather-top-row">
            <div class="temp-badge">
              <span class="weather-icon">☀️</span>
              <span class="current-temp" id="weather-temp">33℃</span>
              <span class="max-temp" id="weather-max-temp">最高 36℃</span>
            </div>
            <div id="weather-alert-badge" class="weather-alert">⚠️ 熱中症: 厳重警戒</div>
          </div>
          <p id="weather-message" class="weather-advice">
            「まだ大丈夫」と我慢せず、早めに涼しい場所でクールダウンしましょう。
          </p>
        </div>

        <!-- 現在地ステータスバー -->
        <div class="location-status-bar">
          <div id="current-location-status" class="loc-text">
            📍 現在地を取得中...
          </div>
          <button id="btn-refresh-location" class="btn-icon-refresh" title="現在地を再取得">🔄</button>
        </div>

        <!-- メインCTAボタン: 今、休める場所を探す -->
        <div class="hero-cta-section">
          <button id="btn-find-places" class="btn-hero-cta">
            <span class="hero-cta-sub">暑さを我慢しないで</span>
            <span class="hero-cta-main">今、休める場所を探す ➔</span>
          </button>
        </div>

        <!-- おすすめの涼み場所 (第1位ハイライト) -->
        <div class="section-container">
          <div class="section-title-wrap">
            <h3 class="section-title">🌟 最も休みやすい場所</h3>
            <span class="section-hint">休みやすさ総合評価</span>
          </div>
          <div id="home-top-place-card" class="top-place-card">
            <div class="loading-spinner-wrap">
              <div class="spinner"></div>
              <p>近くの涼み場所を計算中...</p>
            </div>
          </div>
        </div>

        <!-- クイックアクション -->
        <div class="quick-nav-grid">
          <button id="btn-quick-map" class="quick-btn map-btn">
            <span class="btn-emoji">🗺️</span>
            <div class="btn-texts">
              <span class="title">地図で見る</span>
              <span class="sub">周辺スポットを全体俯瞰</span>
            </div>
          </button>
          <button id="btn-quick-ar" class="quick-btn ar-btn">
            <span class="btn-emoji">🧭</span>
            <div class="btn-texts">
              <span class="title">ARで案内</span>
              <span class="sub">カメラで方向をすぐ確認</span>
            </div>
          </button>
        </div>
      </section>

      <!-- ================= 2. 涼み場所検索一覧画面 ================= -->
      <section id="tab-view-list" class="tab-view">
        <div class="list-header">
          <div class="list-title-area">
            <h2>涼み場所をさがす</h2>
            <p class="subtext">近さだけでなく「休みやすさ」でご案内します</p>
          </div>
          <!-- ソートタブ -->
          <div class="sort-tabs">
            <button id="sort-recommend-btn" class="sort-tab-btn active">🌟 休みやすさ順</button>
            <button id="sort-distance-btn" class="sort-tab-btn">🚶 近い順</button>
          </div>
        </div>

        <!-- 施設リストコンテナ -->
        <div id="places-list-container" class="places-list">
          <div class="loading-spinner-wrap">
            <div class="spinner"></div>
            <p>涼み場所を読み込み中...</p>
          </div>
        </div>
      </section>

      <!-- ================= 3. 地図画面 ================= -->
      <section id="tab-view-map" class="tab-view">
        <div id="map-container"></div>
        
        <!-- 地図フローティング操作ボタン -->
        <div class="map-floating-controls">
          <button id="btn-map-center" class="map-fab" title="現在地に移動">
            📍 現在地
          </button>
        </div>

        <!-- 選択中の施設フロートバナー -->
        <div id="map-bottom-banner" class="map-banner">
          <!-- JSで動的生成 -->
        </div>
      </section>

      <!-- ================= 4. AR案内画面 ================= -->
      <section id="tab-view-ar" class="tab-view">
        <div id="ar-container">
          <!-- カメラ映像 -->
          <video id="ar-video" autoplay playsinline muted></video>

          <!-- カメラ非使用時の2Dレーダー背景 -->
          <div class="ar-radar-bg">
            <div class="radar-circle circle-1"></div>
            <div class="radar-circle circle-2"></div>
            <div class="radar-crosshair-h"></div>
            <div class="radar-crosshair-v"></div>
            <div id="radar-target-dot" class="radar-blip"></div>
            <div class="radar-self-dot"></div>
          </div>

          <!-- AR HUD (ヘッドアップディスプレイ) -->
          <div class="ar-hud">
            <!-- 上部バー -->
            <div class="ar-top-bar">
              <div class="ar-target-info">
                <span class="ar-target-label">目的地</span>
                <span id="ar-target-name" class="ar-target-title">施設を選択してください</span>
              </div>
              <button id="btn-close-ar" class="ar-btn-close">✕ 閉じる</button>
            </div>

            <!-- 中央ダイナミック矢印ガイド -->
            <div class="ar-center-guide">
              <div id="ar-direction-arrow" class="ar-arrow">
                <svg viewBox="0 0 100 100" class="arrow-svg">
                  <path d="M50 10 L85 75 L50 60 L15 75 Z" fill="currentColor"/>
                </svg>
              </div>
              <div id="ar-guide-message" class="ar-guide-text">端末を水平に向けてください</div>
            </div>

            <!-- 下部情報パネル -->
            <div class="ar-bottom-panel">
              <div class="ar-stats-row">
                <div class="ar-stat-col">
                  <span id="ar-distance-text" class="stat-big">あと -- m</span>
                </div>
                <div class="ar-stat-col">
                  <span id="ar-walking-text" class="stat-sub">徒歩 約--分</span>
                </div>
              </div>
              <div id="ar-compass-heading" class="ar-compass-text">
                方位を取得中...
              </div>
              <div class="ar-controls-row">
                <button id="btn-toggle-ar-camera" class="btn-ar-switch">
                  🧭 レーダー画面に切替
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- ボトムナビゲーションバー -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">ホーム</span>
      </button>
      <button class="nav-item" data-tab="list">
        <span class="nav-icon">🔍</span>
        <span class="nav-label">さがす</span>
      </button>
      <button class="nav-item" data-tab="map">
        <span class="nav-icon">🗺️</span>
        <span class="nav-label">地図</span>
      </button>
      <button class="nav-item" data-tab="ar">
        <span class="nav-icon">🧭</span>
        <span class="nav-label">AR案内</span>
      </button>
    </nav>

    <!-- ================= モーダル群 ================= -->

    <!-- 施設詳細モーダル -->
    <div id="modal-place-detail" class="modal-overlay">
      <div class="modal-card">
        <button class="modal-close" aria-label="閉じる">✕</button>
        <div id="modal-place-detail-body" class="modal-body">
          <!-- JSで動的生成 -->
        </div>
      </div>
    </div>

    <!-- 利用状況報告モーダル (仕様書第17項) -->
    <div id="modal-report" class="modal-overlay">
      <div class="modal-card report-modal-card">
        <button class="modal-close" aria-label="閉じる">✕</button>
        <div class="report-modal-header">
          <h3>今の状況を報告</h3>
          <p id="modal-report-target-name" class="report-target-name">○○施設</p>
          <span class="report-sub">1タップで他のユーザーと共有できます</span>
        </div>
        <div class="report-buttons-grid">
          <button class="report-choice-btn" data-type="seated">
            <span class="report-icon">🪑</span>
            <span class="report-text">座れた</span>
          </button>
          <button class="report-choice-btn" data-type="cool">
            <span class="report-icon">❄️</span>
            <span class="report-text">冷房が効いていた</span>
          </button>
          <button class="report-choice-btn" data-type="crowded">
            <span class="report-icon">👥</span>
            <span class="report-text">混雑していた</span>
          </button>
          <button class="report-choice-btn" data-type="full">
            <span class="report-icon">🚫</span>
            <span class="report-text">満席だった</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- CoolNavi スクリプト群 -->
  <script src="js/recommendation.js"></script>
  <script src="js/location.js"></script>
  <script src="js/places.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
